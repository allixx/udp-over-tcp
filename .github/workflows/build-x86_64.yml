name: Build x86_64 binaries

on:
  push:
    tags:
      - "v*"
  # Build if requested manually from the Actions tab
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux-x86_64:
    name: Linux x86_64 (static)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build static binaries
        run: ./build-static-bins.sh

      - name: Strip binaries
        run: strip --strip-all target/x86_64-unknown-linux-gnu/release/{tcp2udp,udp2tcp}

      - name: Package binaries
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          package="udp-over-tcp-${version}-x86_64-linux-gnu"
          mkdir -p dist
          tar -czf "dist/${package}.tar.gz" \
            -C target/x86_64-unknown-linux-gnu/release \
            tcp2udp udp2tcp
          cd dist
          sha256sum -- *.tar.gz > "${package}.tar.gz.sha256"

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: udp-over-tcp-x86_64-linux-gnu
          path: dist/*
          if-no-files-found: error

  release:
    name: Create GitHub release
    needs: build-linux-x86_64
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: udp-over-tcp-x86_64-linux-gnu
          path: dist

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
